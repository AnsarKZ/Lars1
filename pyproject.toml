[project]
name = "stockrecon"
version = "0.1.0"
description = "Automated stock reconciliation between warehouse and sales channels (case prototype)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
